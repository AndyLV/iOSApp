name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          # Use the newest Xcode bundled with the runner image (ships the
          # latest iOS SDK). If a specific version is required later, pin it here.
          ls /Applications | grep -i xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project test_app.xcodeproj \
            -scheme test_app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/test_app \
            | xcbeautify --quiet

      - name: Export unsigned IPA
        run: |
          export_options=$(mktemp -d)/ExportOptions.plist
          cat > "$export_options" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>enterprise</string>
  <key>compileBitcode</key>
  <false/>
</dict>
</plist>
EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/test_app.xcarchive \
            -optionsPlist "$export_options" \
            -exportPath build/export \
            | xcbeautify --quiet \
            || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ -f build/export/test_app.ipa ]; then
            mv build/export/test_app.ipa artifacts/test_app.ipa
          else
            # Fallback: repackage the .app binary directly
            mkdir -p artifacts/Payload
            cp -R build/test_app.xcarchive/Products/Applications/test_app.app artifacts/Payload/
            (cd artifacts && zip -qr test_app.ipa Payload)
          fi
          ls -lh artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: test_app-unsigned.ipa
          path: artifacts/test_app.ipa
          retention-days: 30
