name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project test_app.xcodeproj \
            -scheme test_app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/test_app \
            | xcbeautify --quiet

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R build/test_app.xcarchive/Products/Applications/test_app.app artifacts/Payload/
          (cd artifacts && zip -qr test_app.ipa Payload)
          ls -lh artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: test_app-unsigned.ipa
          path: artifacts/test_app.ipa
          retention-days: 30
